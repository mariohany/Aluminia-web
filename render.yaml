# Render blueprint for the test deployment: the API (free web service,
# sleeps after ~15 min idle) and Redis (free Key Value). Postgres is Neon,
# not Render — Render's free Postgres is deleted after 30 days — so
# DATABASE_URL is entered by hand. The web app is on Vercel
# (apps/web/vercel.json), which forwards /api/* here.
services:
  - type: web
    name: aluminia-api
    runtime: node
    plan: free
    region: frankfurt
    branch: dev
    # Deploy a push only once GitHub's checks (.github/workflows/ci.yml)
    # pass, so a red commit never runs its migrations on Neon.
    autoDeployTrigger: checksPass
    # --include=dev: NODE_ENV=production would otherwise skip the Nest CLI
    # and TypeScript the build needs.
    # Chrome for the bar optimiser PDF (docs/reports_planing.md §8):
    # npm here doesn't run install scripts, so Puppeteer's download is
    # explicit, into PUPPETEER_CACHE_DIR below — inside the project, so it
    # is still there at runtime (Render keeps only the project folder).
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/api && npx --workspace=apps/api puppeteer browsers install chrome
    # Free plan has no pre-deploy step, so migrations run before start.
    # The API refuses to boot with pending migrations anyway.
    startCommand: npm run migrate:all --workspace=apps/api && npm run start:prod --workspace=apps/api
    healthCheckPath: /health
    envVars:
      # Same major as local: the API requires @repo/types' .ts files at
      # runtime and relies on Node's built-in type stripping.
      - key: NODE_VERSION
        value: '26'
      - key: NODE_ENV
        value: production
      # Neon's direct (non-pooled) connection string, ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aluminia-redis
          property: connectionString
      # The Vercel URL, e.g. https://aluminia.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Vercel overwrites X-Forwarded-For with the real client IP.
      - key: TRUST_PROXY
        value: 'true'
      # Where Puppeteer downloads Chrome at build time and finds it at
      # runtime. Must be under /opt/render/project to survive the build.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/.cache/puppeteer

  - type: keyvalue
    name: aluminia-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    # Internal connections only.
    ipAllowList: []
